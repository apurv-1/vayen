name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version
        working-directory: Packages/VayenCore

      - name: Build
        run: swift build -v
        working-directory: Packages/VayenCore

      - name: Test
        run: swift test -v
        working-directory: Packages/VayenCore
