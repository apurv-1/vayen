name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for you?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What you would like Vayen to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they fall short.
    validations:
      required: false
  - type: checkboxes
    id: non-goals-check
    attributes:
      label: Non-goals
      options:
        - label: I have read the non-goals list in the README (no orchestration, no dashboard, no writing back to agents) and this request fits within it.
          required: true
